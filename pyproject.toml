[project]
name = "flakelens"
version = "0.1.0"
description = "Separate real LLM failures from flaky ones, with confidence intervals."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "VitaPilot AI LLC", email = "dev@vitapilotai.com"}]
keywords = ["llm","evaluation","testing","flaky","nondeterminism","ci"]
dependencies = []

[project.scripts]
flakelens = "flakelens.cli:main"

[project.urls]
Homepage = "https://github.com/VitaPilot-AI/flakelens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
