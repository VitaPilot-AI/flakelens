name: publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

# Build and publish in ONE job. A two-job hand-off via upload/download-artifact
# silently shipped a stale dist once; there is no reason to pay that risk for a
# build that takes five seconds.
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC — replaces the API token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build
      - run: rm -rf dist && python -m build
      - name: show what will be uploaded
        run: ls -l dist/ && python -c "
import pathlib
for f in sorted(pathlib.Path('dist').iterdir()): print('UPLOADING:', f.name)"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
